# GitHub Actions の依存更新(Python 依存はゼロなので actions のみ)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # codeql-action は init / analyze / upload-sarif の版が揃わないと失敗するため 1 PR にまとめる
      codeql-action:
        patterns:
          - "github/codeql-action*"
