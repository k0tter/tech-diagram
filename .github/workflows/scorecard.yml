name: Scorecard

on:
  schedule:
    - cron: "0 23 * * 5"   # 週次(CI/CodeQL の後に続く金曜夜枠)
  push:
    branches: [main]       # Branch-Protection 等の変更を早く反映
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard 分析
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # SARIF を Security タブへアップロード
      id-token: write          # publish_results の OIDC 署名(公開バッジ用)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # Scorecard の要求(トークン非保持)
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true   # api.scorecard.dev へ公開(README バッジの供給元)
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: results.sarif
